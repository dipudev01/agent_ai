name: Deploy

on:
  push:
    branches: [main]

env:
  APP_IMAGE: ghcr.io/org/bfsi-agent-api

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Set kube context
        run: aws eks update-kubeconfig --region ap-south-1 --name bfsi-ai-staging
      - name: Deploy staging (canary)
        run: |
          helm upgrade --install bfsi-agent infra/helm/bfsi-agent \
            -f infra/helm/bfsi-agent/values-staging.yaml \
            --namespace bfsi --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set autoscaling.maxReplicas=6
          kubectl rollout status deployment/bfsi-agent-api -n bfsi --timeout=300s

  promote-to-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Set kube context
        run: aws eks update-kubeconfig --region ap-south-1 --name bfsi-ai-prod
      - name: Deploy prod (blue/green via argocd)
        run: |
          # GitOps: promote by updating the image tag in the GitOps repo.
          echo "Argocd auto-sync promotes tagged image ${{ github.sha }}"
          # Manual approval gate is handled by the environment protection rule.

  run-db-migrations:
    needs: promote-to-prod
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Alembic migrations (expand-then-contract)
        run: |
          pip install -e "backend[dev]"
          cd backend && alembic upgrade head