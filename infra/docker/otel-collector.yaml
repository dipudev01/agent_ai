receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
  prometheus:
    config:
      scrape_configs:
        - job_name: bfsi-api
          static_configs:
            - targets: ["host.docker.internal:8000"]

processors:
  batch:
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80

exporters:
  otlp:
    endpoint: otelcol:4317
  debug:
    verbosity: detailed
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite, debug]