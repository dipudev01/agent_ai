apiVersion: v1
kind: Secret
metadata:
  name: bfsi-app-secrets
  annotations:
    # In production use external-secrets-operator + Vault/AWS Secrets Manager.
    sealedsecrets.bitnami.com/managed: "true"
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_KMS_MANAGED"
  ENCRYPTION_KEY: "REPLACE_ME_KMS_MANAGED"
  DATABASE_URL: "postgresql+asyncpg://bfsi:CHANGE_ME@postgres:5432/bfsi_ai"
  REDIS_URL: "redis://redis:6379/0"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bfsi-api-sa
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bfsi-api-role
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bfsi-api-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bfsi-api-role
subjects:
  - kind: ServiceAccount
    name: bfsi-api-sa
    namespace: bfsi