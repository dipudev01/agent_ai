_format_version: "3.0"
_transform: true

services:
  - name: bfsi-api
    url: http://api:8000
    connect_timeout: 5000
    read_timeout: 120000
    write_timeout: 120000
    routes:
      - name: bfsi-api
        paths:
          - /api
        protocols:
          - http
          - https
        strip_path: false
        preserve_host: true
    plugins:
      - name: correlation-id
        config:
          header_name: X-Correlation-ID
          generator: uuid
          echo_downstream: true
      - name: rate-limiting
        config:
          minute: 300
          policy: local
          limit_by: ip
          fault_tolerant: false
          hide_client_headers: false
      - name: request-size-limiting
        config:
          allowed_payload_size: 10
          size_unit: megabytes
